<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in to your account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Brand home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 3h20v7.5L11 9.5V21L2 14z" />
      </svg>
      <span class="brand-name">Palladium</span>
    </a>
  </header>

  <main class="login">
    <h1 class="login-title">Log in to your account</h1>



    <form class="login-form" action="#" method="post">
      <div class="field">
        <label class="sr-only" for="email">Email</label>
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="sr-only" for="password">Password</label>
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      </div>

      <a class="forgot" href="https://idxva.github.io/Portfolio" target="_blank" rel="noopener noreferrer">Don't remember your password?</a>

      <button class="btn btn-submit" type="submit">Log In</button>
    </form>
  </main>
</body>
</html>
